<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <!-- 防止手機雙擊放大；viewport-fit=cover 搭配 CSS safe-area 避開瀏海 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>精於勤 • Arcade • 荒於嬉</title>
    <meta name="description" content="夜市風懷舊小遊戲集">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090d16">

    <!-- iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Arcade">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <link rel="stylesheet" href="css/style.css">

    <!-- 核心先載入，再載入各遊戲（每個遊戲自己向 Arcade 註冊） -->
    <script src="js/core.js" defer></script>
    <!-- 載入順序＝首頁卡片順序 -->
    <script src="js/games/whack.js" defer></script>
    <script src="js/games/memory.js" defer></script>
    <script src="js/games/spot.js" defer></script>
    <script src="js/games/mahjong.js" defer></script>
    <script src="js/games/mines.js" defer></script>
    <script src="js/games/wheel.js" defer></script>
    <script src="js/games/pinball.js" defer></script>
    <script src="js/games/pong.js" defer></script>
</head>
<body>
    <div id="app">
        <!-- 遊戲大廳 -->
        <section id="lobby" class="view">
            <header class="lobby-header">
                <h1 class="title">精於勤 • Arcade • 荒於嬉</h1>
            </header>
            <div id="lobbyGrid" class="lobby-grid"></div>
        </section>

        <!-- 各遊戲畫面由 core.js 動態建立在這裡 -->
        <div id="gameViews"></div>
    </div>

    <noscript><p style="padding:24px;text-align:center">請開啟 JavaScript 才能遊玩。</p></noscript>
</body>
</html>
