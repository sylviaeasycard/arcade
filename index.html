<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>夜市遊戲樂園 - Arcade PWA</title>
    
    <!-- PWA Setting -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030712">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="夜市遊戲">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #030712;
            --card-bg: rgba(15, 23, 42, 0.85);
            --card-border: rgba(56, 189, 248, 0.3);
            --neon-blue: #38bdf8;
            --neon-pink: #f43f5e;
            --neon-purple: #a855f7;
            --neon-green: #10b981;
            --neon-yellow: #facc15;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow: hidden;
            touch-action: manipulation;
            position: fixed;
            top: 0;
            left: 0;
        }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .top-bar {
            padding-top: max(8px, env(safe-area-inset-top));
            height: calc(54px + max(0px, env(safe-area-inset-top)));
            padding-left: 16px;
            padding-right: 16px;
            padding-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(3, 7, 18, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            z-index: 999;
            flex-shrink: 0;
        }

        .bar-title {
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn {
            display: none;
            align-items: center;
            gap: 4px;
            background: rgba(56, 189, 248, 0.2);
            border: 1px solid var(--neon-blue);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            z-index: 1000;
        }

        .back-btn:active {
            transform: scale(0.95);
            background: var(--neon-blue);
            color: #000;
        }

        .main-content {
            flex: 1;
            position: relative;
            overflow: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .view-page {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px 12px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .view-page.active {
            display: flex;
            opacity: 1;
        }

        /* 大廳 */
        .menu-grid {
            width: 100%;
            max-width: 420px;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            padding: 6px 0;
        }

        .menu-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .menu-card:active {
            transform: scale(0.96);
            border-color: var(--neon-blue);
        }

        .card-icon { font-size: 2.2rem; }
        .card-title { font-size: 0.95rem; font-weight: 700; color: var(--text-main); }
        .card-tag { font-size: 0.65rem; padding: 2px 8px; border-radius: 10px; background: rgba(255, 255, 255, 0.08); color: var(--neon-blue); font-family: 'Orbitron'; }

        /* 遊戲 stage */
        .game-stage {
            width: 100%;
            max-width: 380px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .status-panel {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .status-val { color: var(--neon-yellow); font-weight: 700; font-family: 'Orbitron'; font-size: 0.95rem; }

        .canvas-box {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        canvas {
            border-radius: 16px;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .ctrl-panel {
            width: 100%;
            display: flex;
            gap: 8px;
            margin-top: 8px;
            justify-content: center;
            flex-shrink: 0;
        }

        .tech-btn {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .tech-btn:active { transform: scale(0.95); background: var(--neon-blue); color: #000; }
        .tech-btn.pink { border-color: var(--neon-pink); color: var(--neon-pink); }
        .tech-btn.pink:active { background: var(--neon-pink); color: #fff; }

        /* ===== 轉盤 ===== */
        .wheel-wrapper { position: relative; width: 280px; height: 280px; }
        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid var(--neon-yellow);
            z-index: 10;
            filter: drop-shadow(0 0 6px var(--neon-yellow));
        }

        .chip-container { display: flex; flex-wrap: wrap; gap: 4px; max-height: 50px; overflow-y: auto; width: 100%; padding: 2px; }
        .chip { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); padding: 2px 6px; border-radius: 10px; font-size: 0.72rem; display: flex; align-items: center; gap: 4px; }
        .chip-remove { color: var(--neon-pink); }

        /* ===== 踩地雷 ===== */
        #minesGrid { display: grid; gap: 4px; width: 280px; }
        .mine-cell {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }
        .mine-cell.revealed { background: rgba(15, 23, 42, 0.9); border-color: rgba(255,255,255,0.05); }

        /* ===== 記憶對對碰 ===== */
        #memoryBoard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 280px; height: 280px; }
        .card-flip { perspective: 1000px; aspect-ratio: 1; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.3s; transform-style: preserve-3d; }
        .card-flip.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; border: 1px solid var(--card-border); }
        .card-front { background: rgba(30, 41, 59, 0.9); color: var(--neon-blue); }
        .card-back { background: rgba(15, 23, 42, 0.95); transform: rotateY(180deg); }

        /* D-Pad 按鈕 */
        .dpad { display: grid; grid-template-columns: repeat(3, 38px); grid-template-rows: repeat(2, 38px); gap: 3px; }
        .dpad-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 6px; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
        .dpad-btn:active { background: var(--neon-blue); color: #000; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 頂部列 -->
    <header class="top-bar">
        <div class="bar-title">
            <span>⚡</span>
            <span id="appHeaderTitle">ARCADE HUB</span>
        </div>
        <button class="back-btn" id="backBtn" onclick="showMenu()">
            ◀ 主選單
        </button>
    </header>

    <!-- 主頁面區域 -->
    <main class="main-content">
        
        <!-- ===== 0. 主選單大廳 ===== -->
        <section id="view-menu" class="view-page active">
            <div class="menu-grid">
                <div class="menu-card" onclick="openGame('wheel', '🍕 美食大輪盤')">
                    <div class="card-icon">🍕</div>
                    <div class="card-title">美食輪盤</div>
                    <div class="card-tag">DECISION</div>
                </div>
                <div class="menu-card" onclick="openGame('mines', '🌿 踩坑避雷')">
                    <div class="card-icon">💣</div>
                    <div class="card-title">踩坑避雷</div>
                    <div class="card-tag">PUZZLE</div>
                </div>
                <div class="menu-card" onclick="openGame('pinball', '🔮 夜市彈珠台')">
                    <div class="card-icon">🔮</div>
                    <div class="card-title">夜市彈珠</div>
                    <div class="card-tag">PHYSICS</div>
                </div>
                <div class="menu-card" onclick="openGame('memory', '🃏 記憶對對碰')">
                    <div class="card-icon">🃏</div>
                    <div class="card-title">記憶翻牌</div>
                    <div class="card-tag">BRAIN</div>
                </div>
                <div class="menu-card" onclick="openGame('snake', '🐍 賽博貪食蛇')">
                    <div class="card-icon">🐍</div>
                    <div class="card-title">賽博貪食蛇</div>
                    <div class="card-tag">CLASSIC</div>
                </div>
                <div class="menu-card" onclick="openGame('pong', '🏓 霓虹雙人桌球')">
                    <div class="card-icon">🏓</div>
                    <div class="card-title">霓虹桌球</div>
                    <div class="card-tag">ARCADE</div>
                </div>
            </div>
        </section>

        <!-- ===== 1. 美食輪盤 ===== -->
        <section id="game-wheel" class="view-page">
            <div class="game-stage">
                <div class="status-panel">
                    <span id="wheelResult" style="color:var(--neon-yellow); font-weight:bold;">🔮 點擊按鈕旋轉！</span>
                </div>
                <div class="canvas-box">
                    <div class="wheel-wrapper">
                        <div class="wheel-pointer"></div>
                        <canvas id="wheelCanvas" width="500" height="500"></canvas>
                    </div>
                </div>
                <div class="chip-container" id="optionList"></div>
                <div class="ctrl-panel">
                    <input type="text" id="newOptInput" placeholder="新增美食..." style="background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:6px; border-radius:8px; width:110px; font-size:0.8rem;">
                    <button class="tech-btn" onclick="addOption()">新增</button>
                    <button class="tech-btn pink" onclick="startSpin()">🚀 旋轉！</button>
                </div>
            </div>
        </section>

        <!-- ===== 2. 踩坑避雷 ===== -->
        <section id="game-mines" class="view-page">
            <div class="game-stage">
                <div class="status-panel">
                    <span id="minesStatus">選擇難度開始...</span>
                </div>
                <div class="canvas-box">
                    <div id="minesGrid"></div>
                </div>
                <div class="ctrl-panel">
                    <button class="tech-btn" onclick="setMinesDifficulty('easy')">初級</button>
                    <button class="tech-btn" onclick="setMinesDifficulty('mid')">中級</button>
                    <button class="tech-btn" onclick="setMinesDifficulty('hard')">高級</button>
                    <button class="tech-btn pink" id="flagModeBtn" onclick="toggleFlagMode()">🚩 模式: 踩雷</button>
                </div>
            </div>
        </section>

        <!-- ===== 3. 夜市彈珠台 ===== -->
        <section id="game-pinball" class="view-page">
            <div class="game-stage">
                <div class="status-panel">
                    <span>得分: <span id="pbScore" class="status-val">0</span></span>
                    <span>剩餘球數: <span id="pbBalls" class="status-val">5</span></span>
                </div>
                <div class="canvas-box">
                    <canvas id="pinballCanvas" width="280" height="380"></canvas>
                </div>
                <div class="ctrl-panel">
                    <span style="font-size:0.75rem; color:var(--text-muted); align-self:center;">力道:</span>
                    <input type="range" id="pbPowerRange" min="10" max="22" value="16" style="width:80px; align-self:center;">
                    <button class="tech-btn pink" onclick="launchPinball()">🚀 發射球！</button>
                </div>
            </div>
        </section>

        <!-- ===== 4. 記憶對對碰 ===== -->
        <section id="game-memory" class="view-page">
            <div class="game-stage">
                <div class="status-panel">
                    <span>時間: <span id="memTime" class="status-val">0</span>s</span>
                    <span>步數: <span id="memMoves" class="status-val">0</span></span>
                </div>
                <div class="canvas-box">
                    <div id="memoryBoard"></div>
                </div>
                <div class="ctrl-panel">
                    <button class="tech-btn pink" onclick="initMemoryGame()">🔄 重新開始</button>
                </div>
            </div>
        </section>

        <!-- ===== 5. 賽博貪食蛇 ===== -->
        <section id="game-snake" class="view-page">
            <div class="game-stage">
                <div class="status-panel">
                    <span>得分: <span id="snakeScore" class="status-val">0</span></span>
                </div>
                <div class="canvas-box">
                    <canvas id="snakeCanvas" width="280" height="280"></canvas>
                </div>
                <div class="ctrl-panel" style="justify-content:space-between; align-items:center;">
                    <button class="tech-btn pink" onclick="toggleSnakeGame()">▶️ 開始/暫停</button>
                    <div class="dpad">
                        <div></div>
                        <div class="dpad-btn" onclick="changeSnakeDir('UP')">▲</div>
                        <div></div>
                        <div class="dpad-btn" onclick="changeSnakeDir('LEFT')">◄</div>
                        <div class="dpad-btn" onclick="changeSnakeDir('DOWN')">▼</div>
                        <div class="dpad-btn" onclick="changeSnakeDir('RIGHT')">►</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ===== 6. 霓虹桌球 ===== -->
        <section id="game-pong" class="view-page">
            <div class="game-stage">
                <div class="status-panel">
                    <span>P1: <span id="pongP1Score" class="status-val">0</span></span>
                    <span>VS</span>
                    <span>AI: <span id="pongP2Score" class="status-val">0</span></span>
                </div>
                <div class="canvas-box">
                    <canvas id="pongCanvas" width="280" height="360"></canvas>
                </div>
                <div class="ctrl-panel">
                    <button class="tech-btn pink" onclick="togglePongGame()">▶️ 開始/暫停</button>
                </div>
            </div>
        </section>

    </main>
</div>

<script>
/* ===== 路由與控制 ===== */
function showMenu() {
    document.querySelectorAll('.view-page').forEach(el => el.classList.remove('active'));
    document.getElementById('view-menu').classList.add('active');
    document.getElementById('backBtn').style.display = 'none';
    document.getElementById('appHeaderTitle').innerText = 'ARCADE HUB';

    pauseSnakeGame();
    pausePongGame();
}

function openGame(gameId, title) {
    document.querySelectorAll('.view-page').forEach(el => el.classList.remove('active'));
    const target = document.getElementById('game-' + gameId);
    if (target) target.classList.add('active');
    
    document.getElementById('backBtn').style.display = 'inline-flex';
    document.getElementById('appHeaderTitle').innerText = title;

    if (gameId === 'wheel') drawWheel();
    if (gameId === 'mines') setMinesDifficulty('easy');
    if (gameId === 'pinball') resetPinball();
    if (gameId === 'memory') initMemoryGame();
    if (gameId === 'snake') resetSnakeGame();
    if (gameId === 'pong') resetPongGame();
}

/* ===== 1. 美食輪盤 ===== */
let options = ['🍕 披薩', '🍜 熱湯麵', '🍱 便當', '🍔 漢堡', '🍲 火鍋', '🍣 壽司'];
const colors = ['#f43f5e', '#f97316', '#eab308', '#10b981', '#06b6d4', '#6366f1', '#a855f7', '#ec4899'];
const wheelCanvas = document.getElementById('wheelCanvas');
const wheelCtx = wheelCanvas.getContext('2d');
let currentAngle = 0, isSpinning = false;

function drawWheel() {
    const num = options.length;
    const arc = (2 * Math.PI) / num;
    wheelCtx.clearRect(0, 0, 500, 500);

    for (let i = 0; i < num; i++) {
        const angle = currentAngle + i * arc;
        wheelCtx.beginPath();
        wheelCtx.moveTo(250, 250);
        wheelCtx.arc(250, 250, 230, angle, angle + arc);
        wheelCtx.fillStyle = colors[i % colors.length];
        wheelCtx.fill();
        wheelCtx.strokeStyle = "#030712";
        wheelCtx.lineWidth = 4;
        wheelCtx.stroke();

        wheelCtx.save();
        wheelCtx.translate(250 + Math.cos(angle + arc / 2) * 140, 250 + Math.sin(angle + arc / 2) * 140);
        wheelCtx.rotate(angle + arc / 2 + Math.PI / 2);
        wheelCtx.font = "900 22px sans-serif";
        wheelCtx.fillStyle = "#ffffff";
        wheelCtx.fillText(options[i], -wheelCtx.measureText(options[i]).width / 2, 0);
        wheelCtx.restore();
    }
    renderOptionChips();
}

function renderOptionChips() {
    const container = document.getElementById('optionList');
    container.innerHTML = '';
    options.forEach((opt, idx) => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.innerHTML = `<span>${opt}</span><span class="chip-remove" onclick="removeOption(${idx})">✕</span>`;
        container.appendChild(chip);
    });
}

function addOption() {
    const input = document.getElementById('newOptInput');
    const val = input.value.trim();
    if (val) { options.push(val); input.value = ''; drawWheel(); }
}

function removeOption(idx) {
    if (options.length <= 2) return alert("至少留2個選項！");
    options.splice(idx, 1); drawWheel();
}

function startSpin() {
    if (isSpinning) return;
    isSpinning = true;
    document.getElementById('wheelResult').innerText = "🔮 旋轉中...";
    const spinAngle = Math.PI * 12 + Math.random() * Math.PI * 4;
    let start = null;

    function animate(timestamp) {
        if (!start) start = timestamp;
        const progress = Math.min((timestamp - start) / 3500, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = easeOut * spinAngle;
        drawWheel();

        if (progress < 1) requestAnimationFrame(animate);
        else {
            isSpinning = false;
            const num = options.length;
            const arc = (2 * Math.PI) / num;
            let norm = (1.5 * Math.PI - (currentAngle % (2 * Math.PI)) + 4 * Math.PI) % (2 * Math.PI);
            let idx = Math.floor(norm / arc);
            document.getElementById('wheelResult').innerText = "🎉 決定吃：" + options[idx] + "！";
        }
    }
    requestAnimationFrame(animate);
}

/* ===== 2. 踩坑避雷 ===== */
let minesSize = 6, mineCount = 5;
let minesBoard = [], isFlagMode = false, minesGameOver = false;

function setMinesDifficulty(diff) {
    if (diff === 'easy') { minesSize = 6; mineCount = 5; }
    if (diff === 'mid') { minesSize = 8; mineCount = 10; }
    if (diff === 'hard') { minesSize = 10; mineCount = 18; }
    initMinesGame();
}

function toggleFlagMode() {
    isFlagMode = !isFlagMode;
    document.getElementById('flagModeBtn').innerText = isFlagMode ? "🚩 模式: 插旗" : "🚩 模式: 踩雷";
}

function initMinesGame() {
    minesGameOver = false;
    document.getElementById('minesStatus').innerText = `地圖 ${minesSize}x${minesSize}，剩餘地雷: ${mineCount}`;
    const grid = document.getElementById('minesGrid');
    grid.style.gridTemplateColumns = `repeat(${minesSize}, 1fr)`;
    grid.innerHTML = '';

    minesBoard = Array(minesSize).fill(null).map(() => 
        Array(minesSize).fill(null).map(() => ({ mine: false, revealed: false, flagged: false, count: 0 }))
    );

    let placed = 0;
    while (placed < mineCount) {
        let r = Math.floor(Math.random() * minesSize), c = Math.floor(Math.random() * minesSize);
        if (!minesBoard[r][c].mine) { minesBoard[r][c].mine = true; placed++; }
    }

    for (let r = 0; r < minesSize; r++) {
        for (let c = 0; c < minesSize; c++) {
            if (minesBoard[r][c].mine) continue;
            let cnt = 0;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    let nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < minesSize && nc >= 0 && nc < minesSize && minesBoard[nr][nc].mine) cnt++;
                }
            }
            minesBoard[r][c].count = cnt;
        }
    }

    let cellSize = Math.floor(280 / minesSize) - 4;
    for (let r = 0; r < minesSize; r++) {
        for (let c = 0; c < minesSize; c++) {
            const cell = document.createElement('div');
            cell.className = 'mine-cell';
            cell.style.width = cellSize + 'px';
            cell.style.height = cellSize + 'px';
            cell.id = `cell-${r}-${c}`;
            cell.onclick = () => handleCellClick(r, c);
            grid.appendChild(cell);
        }
    }
}

function handleCellClick(r, c) {
    if (minesGameOver) return;
    const item = minesBoard[r][c];
    const el = document.getElementById(`cell-${r}-${c}`);

    if (isFlagMode) {
        if (item.revealed) return;
        item.flagged = !item.flagged;
        el.innerText = item.flagged ? "🚩" : "";
        return;
    }

    if (item.flagged || item.revealed) return;
    item.revealed = true;
    el.classList.add('revealed');

    if (item.mine) {
        minesGameOver = true;
        el.innerText = "💥"; el.style.background = "#ef4444";
        document.getElementById('minesStatus').innerText = "💥 踩雷了！遊戲結束！";
    } else {
        if (item.count > 0) el.innerText = item.count;
        else {
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    let nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < minesSize && nc >= 0 && nc < minesSize && !minesBoard[nr][nc].revealed) {
                        handleCellClick(nr, nc);
                    }
                }
            }
        }
    }
}

/* ===== 3. 夜市彈珠台 ===== */
const pbCanvas = document.getElementById('pinballCanvas');
const pbCtx = pbCanvas.getContext('2d');
let pbScore = 0, pbBalls = 3, pbIsMoving = false;
let pbBall = { x: 260, y: 350, vx: 0, vy: 0, r: 8 };

const pbObstacles = [
    { x: 80, y: 120, r: 16, pts: 100 },
    { x: 140, y: 80, r: 16, pts: 200 },
    { x: 200, y: 120, r: 16, pts: 100 },
    { x: 110, y: 180, r: 16, pts: 500 },
    { x: 170, y: 180, r: 16, pts: 500 },
];

function resetPinball() {
    pbBall = { x: 260, y: 350, vx: 0, vy: 0, r: 8 };
    pbIsMoving = false;
    drawPinball();
}

function drawPinball() {
    pbCtx.clearRect(0, 0, 280, 380);
    pbCtx.fillStyle = "#020617";
    pbCtx.fillRect(0, 0, 280, 380);

    pbCtx.strokeStyle = "rgba(56, 189, 248, 0.4)";
    pbCtx.lineWidth = 2;
    pbCtx.strokeRect(10, 10, 260, 360);

    // 軌道
    pbCtx.beginPath(); pbCtx.moveTo(240, 10); pbCtx.lineTo(240, 370);
    pbCtx.strokeStyle = "rgba(255, 255, 255, 0.15)"; pbCtx.stroke();

    // 障礙物
    pbObstacles.forEach(obs => {
        pbCtx.beginPath(); pbCtx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2);
        pbCtx.fillStyle = "#a855f7"; pbCtx.fill();
        pbCtx.strokeStyle = "#fff"; pbCtx.stroke();
    });

    // 底部得分區
    const slots = ['100', '500', '1000', '500', '100'];
    for(let i=0; i<5; i++) {
        pbCtx.fillStyle = "rgba(255,255,255,0.05)";
        pbCtx.fillRect(10 + i * 46, 320, 42, 45);
        pbCtx.font = "bold 10px Orbitron";
        pbCtx.fillStyle = "#facc15";
        pbCtx.fillText(slots[i], 18 + i * 46, 345);
    }

    // 球
    pbCtx.beginPath(); pbCtx.arc(pbBall.x, pbBall.y, pbBall.r, 0, Math.PI * 2);
    pbCtx.fillStyle = "#38bdf8"; pbCtx.fill();
}

function launchPinball() {
    if (pbIsMoving) return;
    if (pbBalls <= 0) { pbBalls = 3; pbScore = 0; }
    pbBalls--;
    document.getElementById('pbBalls').innerText = pbBalls;
    document.getElementById('pbScore').innerText = pbScore;

    const power = parseFloat(document.getElementById('pbPowerRange').value);
    pbBall = { x: 250, y: 340, vx: 0, vy: -power, r: 8 };
    pbIsMoving = true;
    animPinball();
}

function animPinball() {
    if (!pbIsMoving) return;

    pbBall.vy += 0.25; // 重力
    pbBall.x += pbBall.vx;
    pbBall.y += pbBall.vy;

    // 頂部彎道
    if (pbBall.y < 30 && pbBall.x > 180) { pbBall.vx -= 0.6; }

    // 牆壁碰撞
    if (pbBall.x - pbBall.r < 10) { pbBall.x = 10 + pbBall.r; pbBall.vx = -pbBall.vx * 0.8; }
    if (pbBall.x + pbBall.r > 270) { pbBall.x = 270 - pbBall.r; pbBall.vx = -pbBall.vx * 0.8; }
    if (pbBall.y - pbBall.r < 10) { pbBall.y = 10 + pbBall.r; pbBall.vy = -pbBall.vy * 0.8; }

    // 撞擊障礙物
    pbObstacles.forEach(obs => {
        let dx = pbBall.x - obs.x, dy = pbBall.y - obs.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < pbBall.r + obs.r) {
            pbBall.vx = (dx / dist) * 4;
            pbBall.vy = (dy / dist) * 4;
            pbScore += obs.pts;
            document.getElementById('pbScore').innerText = pbScore;
        }
    });

    // 掉落底部
    if (pbBall.y > 330) {
        pbIsMoving = false;
        let idx = Math.floor((pbBall.x - 10) / 46);
        const map = [100, 500, 1000, 500, 100];
        if (idx >= 0 && idx < 5) pbScore += map[idx];
        document.getElementById('pbScore').innerText = pbScore;
        setTimeout(resetPinball, 1000);
        return;
    }

    drawPinball();
    requestAnimationFrame(animPinball);
}

/* ===== 4. 記憶對對碰 ===== */
const memEmojis = ['🐶', '🐱', '🐼', '🦊', '🐸', '🦁', '🦄', '🐵'];
let flippedCards = [], memTimer = null, memSeconds = 0, memMoves = 0;

function initMemoryGame() {
    clearInterval(memTimer);
    memSeconds = 0; memMoves = 0; flippedCards = [];
    document.getElementById('memTime').innerText = '0';
    document.getElementById('memMoves').innerText = '0';
    
    const boardEl = document.getElementById('memoryBoard');
    boardEl.innerHTML = '';
    let cards = [...memEmojis, ...memEmojis].sort(() => Math.random() - 0.5);

    cards.forEach((emoji) => {
        const card = document.createElement('div');
        card.className = 'card-flip';
        card.innerHTML = `<div class="card-inner"><div class="card-front">❓</div><div class="card-back">${emoji}</div></div>`;
        card.onclick = () => {
            if (flippedCards.length < 2 && !card.classList.contains('flipped')) {
                card.classList.add('flipped');
                flippedCards.push(card);
                if (flippedCards.length === 2) {
                    memMoves++;
                    document.getElementById('memMoves').innerText = memMoves;
                    const [c1, c2] = flippedCards;
                    if (c1.querySelector('.card-back').innerText === c2.querySelector('.card-back').innerText) {
                        flippedCards = [];
                    } else {
                        setTimeout(() => { c1.classList.remove('flipped'); c2.classList.remove('flipped'); flippedCards = []; }, 600);
                    }
                }
            }
        };
        boardEl.appendChild(card);
    });

    memTimer = setInterval(() => { memSeconds++; document.getElementById('memTime').innerText = memSeconds; }, 1000);
}

/* ===== 5. 賽博貪食蛇 ===== */
const snakeCanvas = document.getElementById('snakeCanvas');
const snakeCtx = snakeCanvas.getContext('2d');
let snake = [{x: 8, y: 8}], snakeDir = {x: 1, y: 0}, snakeFood = {x: 3, y: 3};
let snakeScore = 0, snakeInterval = null, isSnakeRunning = false;

function resetSnakeGame() {
    pauseSnakeGame();
    snake = [{x: 8, y: 8}]; snakeDir = {x: 1, y: 0};
    snakeScore = 0; document.getElementById('snakeScore').innerText = '0';
    drawSnake();
}

function drawSnake() {
    snakeCtx.fillStyle = "#020617";
    snakeCtx.fillRect(0, 0, 280, 280);
    
    snakeCtx.fillStyle = "#f43f5e";
    snakeCtx.fillRect(snakeFood.x * 14, snakeFood.y * 14, 12, 12);

    snakeCtx.fillStyle = "#38bdf8";
    snake.forEach(s => snakeCtx.fillRect(s.x * 14, s.y * 14, 12, 12));
}

function updateSnake() {
    const head = {x: snake[0].x + snakeDir.x, y: snake[0].y + snakeDir.y};
    if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20) return resetSnakeGame();
    snake.unshift(head);
    if (head.x === snakeFood.x && head.y === snakeFood.y) {
        snakeScore += 10;
        document.getElementById('snakeScore').innerText = snakeScore;
        snakeFood = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
    } else { snake.pop(); }
    drawSnake();
}

function changeSnakeDir(dir) {
    if (dir==='UP' && snakeDir.y===0) snakeDir={x:0, y:-1};
    if (dir==='DOWN' && snakeDir.y===0) snakeDir={x:0, y:1};
    if (dir==='LEFT' && snakeDir.x===0) snakeDir={x:-1, y:0};
    if (dir==='RIGHT' && snakeDir.x===0) snakeDir={x:1, y:0};
}

function toggleSnakeGame() {
    if (isSnakeRunning) pauseSnakeGame();
    else { isSnakeRunning = true; snakeInterval = setInterval(updateSnake, 140); }
}
function pauseSnakeGame() { isSnakeRunning = false; clearInterval(snakeInterval); }

/* ===== 6. 霓虹桌球 ===== */
const pongCanvas = document.getElementById('pongCanvas');
const pongCtx = pongCanvas.getContext('2d');
let pongBall = {x: 140, y: 180, vx: 3, vy: 4}, p1X = 105, p2X = 105, isPongRunning = false, pongAnim = null;
let p1Score = 0, p2Score = 0;

function resetPongGame() {
    pausePongGame();
    pongBall = {x: 140, y: 180, vx: 3, vy: 4};
    drawPong();
}

pongCanvas.addEventListener('touchmove', (e) => {
    const rect = pongCanvas.getBoundingClientRect();
    const touchX = e.touches[0].clientX - rect.left;
    p1X = Math.max(0, Math.min(210, touchX - 35));
});

function drawPong() {
    pongCtx.clearRect(0, 0, 280, 360);
    pongCtx.fillStyle = "#020617";
    pongCtx.fillRect(0, 0, 280, 360);

    pongCtx.fillStyle = "#38bdf8";
    pongCtx.fillRect(p1X, 340, 70, 10);

    pongCtx.fillStyle = "#f43f5e";
    pongCtx.fillRect(p2X, 10, 70, 10);

    pongCtx.fillStyle = "#facc15";
    pongCtx.beginPath(); pongCtx.arc(pongBall.x, pongBall.y, 6, 0, Math.PI*2); pongCtx.fill();
}

function updatePong() {
    if (!isPongRunning) return;

    pongBall.x += pongBall.vx;
    pongBall.y += pongBall.vy;

    p2X += (pongBall.x - (p2X + 35)) * 0.1;

    if (pongBall.x < 6 || pongBall.x > 274) pongBall.vx = -pongBall.vx;

    if (pongBall.y >= 334 && pongBall.x >= p1X && pongBall.x <= p1X + 70) {
        pongBall.vy = -Math.abs(pongBall.vy);
    }

    if (pongBall.y <= 20 && pongBall.x >= p2X && pongBall.x <= p2X + 70) {
        pongBall.vy = Math.abs(pongBall.vy);
    }

    if (pongBall.y > 360) { p2Score++; resetPongGame(); }
    if (pongBall.y < 0) { p1Score++; resetPongGame(); }

    document.getElementById('pongP1Score').innerText = p1Score;
    document.getElementById('pongP2Score').innerText = p2Score;

    drawPong();
    if (isPongRunning) pongAnim = requestAnimationFrame(updatePong);
}

function togglePongGame() {
    if (isPongRunning) pausePongGame();
    else { isPongRunning = true; pongAnim = requestAnimationFrame(updatePong); }
}
function pausePongGame() { isPongRunning = false; cancelAnimationFrame(pongAnim); }
